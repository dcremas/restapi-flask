# api.dustincremascoli.com — the Weather Data API.
#
# Installed by provision.sh once a certificate exists. Before that, provision.sh
# writes an HTTP-only vhost so certbot can complete the ACME challenge.

# Per-IP rate limits. A public unauthenticated API needs a brake, and nginx is
# the right place for it: it costs nothing and it protects Postgres, not just the
# Python process. The app has no in-process limiter — this is the only one.
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_burst:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

upstream restapi_app {
    server unix:/run/restapi/restapi.sock fail_timeout=0;
}

# Small response cache. Historical observations are immutable once ingested, so
# repeated identical queries should never reach Python at all.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=256m inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name api.dustincremascoli.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dustincremascoli.com;

    ssl_certificate     /etc/letsencrypt/live/api.dustincremascoli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dustincremascoli.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # The app sets this too. Hide the upstream copy before adding ours, or the
    # response carries the header twice — harmless but sloppy, and it makes
    # header-diffing during an incident confusing.
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;
    # No X-Frame-Options: this is JSON, not a page, and /docs is meant to be
    # embeddable. Nothing here is authenticated, so framing carries no risk.

    # JSON compresses by roughly 10x, and a 1000-record page is not small.
    gzip on;
    gzip_types application/json application/problem+json application/javascript text/css;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_proxied any;

    # Bodies are irrelevant to a read-only API; refuse large ones outright.
    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    limit_conn api_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    # Readiness and liveness: never cached, never rate limited. A monitor must
    # get the truth, and must not be able to lock itself out.
    location = /health {
        proxy_pass http://restapi_app;
        include /etc/nginx/proxy_params_restapi.inc;
        access_log off;
    }
    location = /ready {
        proxy_pass http://restapi_app;
        include /etc/nginx/proxy_params_restapi.inc;
        access_log off;
    }

    # Swagger UI assets: static, immutable, cacheable hard.
    location /docs {
        proxy_pass http://restapi_app;
        include /etc/nginx/proxy_params_restapi.inc;
        proxy_cache api_cache;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    # The data endpoints.
    location / {
        limit_req zone=api_rate burst=40 nodelay;
        limit_req zone=api_burst burst=20 nodelay;

        proxy_pass http://restapi_app;
        include /etc/nginx/proxy_params_restapi.inc;

        # Honour the Cache-Control the app sets per dataset (1h historical,
        # 5m forecast) rather than second-guessing it here.
        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # One upstream request per key when several arrive together, so a cold
        # cache under load does not become a stampede on Postgres.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # Serve slightly stale rather than an error while revalidating: better
        # for a client than a 5xx, and it shields the database during a blip.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    error_page 502 503 504 /___unavailable;
    location = /___unavailable {
        internal;
        default_type application/problem+json;
        # Even the gateway's own failures answer in the API's error format, so a
        # client never has to parse HTML to discover the service is down.
        return 503 '{"type":"https://api.dustincremascoli.com/problems/service-unavailable","title":"Service Unavailable","status":503,"detail":"The API is restarting or unavailable. Retry shortly."}';
    }
}
